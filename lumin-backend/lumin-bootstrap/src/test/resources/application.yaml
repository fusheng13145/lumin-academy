spring:
  datasource:
    # 持久化集成测试直连本机真实 MySQL（07 §1.2：不用 H2 替代事务/锁/去重验证）。
    # 凭据经环境变量注入（LUMIN_TEST_DB_USERNAME/LUMIN_TEST_DB_PASSWORD），不落盘；
    # 未配置时集成测试按 Assumption 诚实跳过。
    url: jdbc:mysql://127.0.0.1:3306/lumin_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${LUMIN_TEST_DB_USERNAME:root}
    password: ${LUMIN_TEST_DB_PASSWORD:}
    hikari:
      # 全量集成测试会缓存多个 Spring 上下文；每池最多 2 条连接，避免累积触顶
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    # 测试库由 TestDatabase 按迁移脚本重建；关闭启动迁移避免二次执行。
    enabled: false
  outbox:
    enabled: false
  mybatis:
    configuration:
      map-underscore-to-camel-case: true
      arg-name-based-constructor-auto-mapping: true

lumin:
  outbox:
    enabled: false
  cursor:
    key: lumin-cursor-key-test
  review:
    calibration-valid: false
    sample-seed: lumin-review-seed-test
  restriction:
    expiry-scan:
      # 集成测试直调 RestrictionService#expireDueTemporary，关闭后台调度避免不确定性
      enabled: false
