spring:
  application:
    name: lumin-backend
  datasource:
    # 08 §3：凭据一律经环境变量注入（DATABASE_DSN/DATABASE_USERNAME/DATABASE_PASSWORD），
    # 禁止写入代码或镜像；默认值仅为本地开发占位
    url: ${DATABASE_DSN:jdbc:mysql://127.0.0.1:3306/lumin?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # 主应用上下文加载不因数据库暂不可达而失败；真实可用性由集成测试与部署准入验证
      initialization-fail-timeout: -1
  flyway:
    # 08 §3：生产库由启动迁移门禁建设；测试库由 TestDatabase 手工重建，故测试 profile 关闭。
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
  outbox:
    enabled: true
    interval-ms: 1000
  mybatis:
    configuration:
      map-underscore-to-camel-case: true
      arg-name-based-constructor-auto-mapping: true
# P0-B 增量四（2026-11-16）：持久化单元落地，移除增量一时的 DataSource/MyBatis
# 自动配置排除；生产部署须另行提供 Secret Manager 注入的 DSN（08 §3）。

lumin:
  outbox:
    enabled: true
    interval-ms: 1000
  # 2026-11-20 安全审查修复：部署形态（production 时禁止 demo 认证、开始下发 HSTS）
  deployment:
    environment: ${LUMIN_ENV:dev}
    https: ${LUMIN_HTTPS:false}
  # CORS 白名单（2026-11-20 审查 16 项）：逗号分隔的精确来源，**不支持通配符**；
  # 留空 = 不注册任何跨源映射（浏览器照旧拦截），而不是默认放开。
  cors:
    allowed-origins: ${LUMIN_CORS_ALLOWED_ORIGINS:}
    max-age-seconds: ${LUMIN_CORS_MAX_AGE_SECONDS:3600}
  auth:
    # UGC-002：session=演示头被忽略（生产必须 session，安全门禁 SecurityStartupValidator
    # 在非 dev 环境强制校验）；demo=仅限本地开发/测试骨架
    mode: ${LUMIN_AUTH_MODE:demo}
    # 免认证入口（登录/注册/二次验证挑战）的按 IP 配额（2026-11-20 审查 19 项）：
    # 固定 1 分钟窗口、落库计数（多副本一致）；默认 20 次/分钟（NAT 出口共享可调大）
    ip-limit:
      enabled: ${LUMIN_AUTH_IP_LIMIT_ENABLED:true}
      attempts-per-minute: ${LUMIN_AUTH_IP_LIMIT_ATTEMPTS:20}
    # 口令找回（V24）：unconfigured = 邮件通道"明确失败"并转人工工单（不假装投递成功）；
    # smtp = 真实投递（参数不全/带口令却不开加密 → 启动失败，见 SecurityStartupValidator）
    reset:
      mail-mode: ${LUMIN_AUTH_RESET_MAIL_MODE:unconfigured}
      mail:
        host: ${LUMIN_AUTH_RESET_MAIL_HOST:}
        port: ${LUMIN_AUTH_RESET_MAIL_PORT:587}
        username: ${LUMIN_AUTH_RESET_MAIL_USERNAME:}
        password: ${LUMIN_AUTH_RESET_MAIL_PASSWORD:}
        from: ${LUMIN_AUTH_RESET_MAIL_FROM:}
        # STARTTLS 默认开且 required：服务器不支持就失败，不降级明文
        starttls: ${LUMIN_AUTH_RESET_MAIL_STARTTLS:true}
        ssl: ${LUMIN_AUTH_RESET_MAIL_SSL:false}
        timeout-seconds: ${LUMIN_AUTH_RESET_MAIL_TIMEOUT_SECONDS:10}
  # 写操作限流：默认关闭（开发/测试）；生产 profile 显式开启
  rate-limit:
    enabled: ${LUMIN_RATE_LIMIT_ENABLED:false}
    writes-per-minute: ${LUMIN_RATE_LIMIT_WRITES_PER_MINUTE:120}
  cursor:
    # UGC-009 游标签名密钥：**无开发默认值**——缺 LUMIN_CURSOR_KEY 即启动失败
    # （2026-11-20 修复：原默认 lumin-cursor-dev-key 使 fail-fast 永不触发）
    key: ${LUMIN_CURSOR_KEY:}
  crypto:
    # UGC-007 字段加密密钥（AES-256-GCM）：**无开发默认值**——生产经 Secret Manager 注入
    # （2026-11-20 修复：原默认 lumin-crypto-dev-key 使 fail-fast 永不触发）
    key: ${LUMIN_CRYPTO_KEY:}
  review:
    # K-03 校准门禁（T48）通过前为 false——机审路由全转人工（03 §5.3 安全默认）
    calibration-valid: false
    sample-seed: ${LUMIN_REVIEW_SAMPLE_SEED:lumin-review-seed-dev}
  restriction:
    expiry-scan:
      # 临时措施到期持久化 EXPIRED：只退出生效集合，不自动公开
      enabled: ${LUMIN_RESTRICTION_EXPIRY_SCAN_ENABLED:true}
      interval-ms: ${LUMIN_RESTRICTION_EXPIRY_SCAN_INTERVAL_MS:300000}
  storage:
    dir: ${LUMIN_STORAGE_DIR:${user.home}/.lumin-storage}
  # AI 供应商：本地 Ollama（默认 deepseek-r1:8b）；后续切换 DeepSeek 官方 API 只改这里。
  ai:
    provider: ${LUMIN_AI_PROVIDER:ollama}
    timeout-seconds: ${LUMIN_AI_TIMEOUT_SECONDS:120}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:deepseek-r1:8b}
      temperature: ${OLLAMA_TEMPERATURE:0.7}
      max-tokens: ${OLLAMA_MAX_TOKENS:1200}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      api-key: ${DEEPSEEK_API_KEY:}
      temperature: ${DEEPSEEK_TEMPERATURE:0.7}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:1200}
    workflow:
      max-revision-attempts: ${LUMIN_AI_MAX_REVISIONS:1}
      max-memory-facts: ${LUMIN_AI_MAX_MEMORY_FACTS:24}
