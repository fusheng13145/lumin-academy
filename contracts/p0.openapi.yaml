      oneOf:
        - properties:
            state: {enum: [COMPLETE]}
            assetId: {type: string, format: uuid}
            failureReason: {type: string, nullable: true, enum: [null]}
        - properties:
            state: {enum: [AWAITING_UPLOAD, CHECKING, REJECTED, EXPIRED]}
            assetId: {type: string, nullable: true, enum: [null]}
      properties:
        id: {$ref: '#/components/schemas/Id'}
        createdBy: {$ref: '#/components/schemas/Id'}
        createdAt: {type: string, format: date-time}
        request: {$ref: '#/components/schemas/AssetUploadRequest'}
