        assetId: {type: string, format: uuid, nullable: true}
        failureReason: {type: string, nullable: true, enum: [SIZE_MISMATCH, HASH_MISMATCH, TYPE_MISMATCH, UNSAFE_CONTENT, UPLOAD_EXPIRED, STORAGE_UNAVAILABLE, null]}
