      type: object
      additionalProperties: false
      description: 上传会话ID不是正式资源ID；只有安全检查通过并最终绑定后才能置COMPLETE并返回非空assetId。CHECKING挂起期间不放行；签名过期不可延长，需新建上传会话。正式对象不可被旧签名覆盖。
