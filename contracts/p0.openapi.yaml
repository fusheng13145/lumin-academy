      oneOf:
        - properties: {purpose: {enum: [COVER]}}
          required: [workId]
          not: {required: [caseId]}
        - properties: {purpose: {enum: [EVIDENCE]}}
          required: [caseId]
          not: {required: [workId]}
      properties:
        purpose: {type: string, enum: [COVER, EVIDENCE]}
        workId: {$ref: '#/components/schemas/Id'}
        caseId: {$ref: '#/components/schemas/Id'}
        contentType: {type: string, enum: [image/jpeg, image/png]}
        sizeBytes: {type: integer, minimum: 1, maximum: 5242880}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    AssetUploadGrant:
      type: object
      additionalProperties: false
      description: 仅对一个服务端生成的隔离对象键签发PUT；expiresAt=createdAt+300秒。requiredHeaders必须原样发送，Content-Type与request.contentType固定一致；大小/hash也绑定授权并在完成时以实际字节复验。签名不能列桶、读桶或写其他键，禁止将uploadUrl当作内容读取地址。幂等重放不延长签名有效期。
      required: [id, createdBy, createdAt, request, revision, state, method, uploadUrl, expiresAt, requiredHeaders]
      oneOf:
        - properties:
            request: {type: object, properties: {contentType: {enum: [image/jpeg]}}}
            requiredHeaders: {type: object, properties: {Content-Type: {enum: [image/jpeg]}}}
        - properties:
            request: {type: object, properties: {contentType: {enum: [image/png]}}}
            requiredHeaders: {type: object, properties: {Content-Type: {enum: [image/png]}}}
      properties:
        id: {$ref: '#/components/schemas/Id'}
        createdBy: {$ref: '#/components/schemas/Id'}
        createdAt: {type: string, format: date-time}
        request: {$ref: '#/components/schemas/AssetUploadRequest'}
        revision: {$ref: '#/components/schemas/Revision'}
        state: {type: string, enum: [AWAITING_UPLOAD]}
        method: {type: string, enum: [PUT]}
        uploadUrl: {type: string, format: uri, pattern: '^https://', maxLength: 4096}
        expiresAt: {type: string, format: date-time}
        requiredHeaders:
          type: object
          additionalProperties: false
          required: [Content-Type]
          properties:
            Content-Type: {type: string, enum: [image/jpeg, image/png]}
