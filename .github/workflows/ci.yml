name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 2026-11-20 安全审查 17/20 项：把"测试全绿"和"依赖无高危"变成可执行的门禁，
# 而不是人工检查项。三个 job 的意义：
#   backend  —— 真实 MySQL 跑全部集成测试；**缺库即失败**（不允许静默跳过）
#   frontend —— lint + 单测 + 双模式构建（npm run verify）
#   security —— Java SCA（OWASP dependency-check）+ npm audit（高危即拦）

jobs:
  backend:
    name: 后端测试（真实 MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lumin-ci-root
          MYSQL_DATABASE: lumin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plumin-ci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # TestDatabase 直连 127.0.0.1:3306 并 DROP/CREATE lumin_test（需 root 权限）
      LUMIN_TEST_DB_USERNAME: root
      LUMIN_TEST_DB_PASSWORD: lumin-ci-root
      # 缺库时让测试**失败**而不是跳过（防止"全跳过=假绿"）
      LUMIN_TEST_REQUIRE_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 编译 + 全量测试（含持久化集成测试）
        working-directory: lumin-backend
        run: mvn -B -pl lumin-bootstrap -am test -Dlumin.test.require-db=true
      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: lumin-backend/**/target/surefire-reports/**

  frontend:
    name: 前端质量门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lumin-frontend/package-lock.json
      - run: npm ci
      - run: npm run verify

  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # npm audit 必须打官方 registry：国内镜像（npmmirror）未实现 audit 端点
      - name: npm audit（生产依赖，高危即失败）
        working-directory: lumin-frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      # 无 NVD_API_KEY 时 NVD 限流会导致数十分钟，故仅在提供密钥时执行
      - name: OWASP dependency-check（Java，CVSS>=7 即失败）
        if: env.NVD_API_KEY != ''
        working-directory: lumin-backend
        run: mvn -B -Psecurity-scan org.owasp:dependency-check-maven:check
      - name: 上传 SCA 报告
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: lumin-backend/**/target/dependency-check-report.*
      - name: 未配置 NVD_API_KEY 时的显式提示
        if: env.NVD_API_KEY == ''
        run: |
          echo "::warning::未配置 NVD_API_KEY，Java SCA 已跳过（不等于无漏洞）。"
          echo "申请：https://nvd.nist.gov/developers/request-an-api-key"
